# javascript.yaml — 由 CodeQL 查询适配的额外规则（自动加载，叠加在内置之上）
# 来源：github/codeql js/ql/src/Security（CWE-078/079/089/094/918/022/502/601/611/643/117/327）
#       + imagemlt/myQLrules（React/Electron）+ advanced-security（弱哈希/硬编码密钥）
# 匹配：sources/sinks/sanitizers 为子串；sink 决定 vuln_type；sanitizer 按 sink 类别生效

javascript:
  sources:
    injection_general:
    - 'req.query'
    - 'req.body'
    - 'req.params'
    - 'req.cookies'
    - 'req.headers'
    - 'req.session'
    - 'req.files'
    - 'req.originalUrl'
    - 'req.url'
    - 'ctx.query'
    - 'ctx.params'
    - 'ctx.request.body'
    - 'ctx.request.query'
    - 'ctx.request.headers'
    - 'ctx.request.files'
    - 'ctx.headers'
    - 'ctx.cookies'
    - 'event.data'
    - 'location.hash'
    - 'location.search'
    - 'location.href'
    - 'location.pathname'
    - 'document.location'
    - 'document.referrer'
    - 'document.URL'
    - 'document.cookie'
    - 'window.name'
    - 'window.location'
    - 'process.argv'
    - 'process.env'

