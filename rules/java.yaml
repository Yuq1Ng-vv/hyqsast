# java.yaml — 由 CodeQL 查询适配的额外规则（自动加载，叠加在内置之上）
# 来源：github/codeql java/ql/src/Security + advanced-security + GeekMasher
#        + jenkins-infra + cldrn（log4j-injection / helidon-rce / LocalCommandInjection）
# 匹配：sources/sinks/sanitizers 为子串；sink 决定 vuln_type；sanitizer 按 sink 类别生效

