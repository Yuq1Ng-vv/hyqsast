    - 'request.query_params'
    - 'request.path_params'
    - 'request.body'
    - 'request.body('
    - 'request.json('
    - 'request.post('
    - 'request.forms'
    - 'request.params'
    - 'request.GET'
    - 'request.POST'
    - 'request.COOKIES'
