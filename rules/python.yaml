# python.yaml — 由 CodeQL 查询适配的额外规则（自动加载，叠加在内置之上）
# 来源：github/codeql python/ql/src/Security + ext/*.model.yml
#       （PEP249/SQLAlchemy/Requests/Flask/Django/FastAPI/Starlette/lxml/xml/pickle/yaml/jinja2）
# 匹配：sources/sinks/sanitizers 为子串；sink 决定 vuln_type；sanitizer 按 sink 类别生效
# 说明：source 类别归属为展示性（BFS 从任意 source 出发），统一归入 injection_general

