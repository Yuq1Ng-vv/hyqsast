    injection_general:
    - 'request.args'
    - 'request.form'
    - 'request.values'
    - 'request.json'
    - 'request.data'
    - 'request.cookies'
    - 'request.headers'
    - 'request.files'
    - 'request.get_json('
    - 'request.get_data('
    - 'request.query_string'
