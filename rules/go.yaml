# go.yaml — 由 CodeQL 查询适配的额外规则（备用：引擎暂未支持 go，规则先行备好）
# 来源：github/codeql go/ql/src/Security + ext/*.model.yml
#       （database/sql、gorm、sqlx、os/exec、net/http、log、crypto；gin/echo/fasthttp/mux/chi 请求模型）
# 匹配：sources/sinks/sanitizers 为子串；sink 决定 vuln_type；sanitizer 按 sink 类别生效

go:
  sources:
    injection_general:
    - '.URL.Query()'
    - '.URL.Query().Get('
    - '.FormValue('
    - '.Form.Get('
    - '.PostForm'
    - '.Header.Get('
    - '.Cookie('
    - '.Cookies()'
    - '.PostFormValue('
    - '.FormFile('
    - '.MultipartReader('
    - '.Referer()'
    - '.UserAgent()'
    - '.RequestURI'
    - '.URL.Path'
    - '.QueryArgs().Peek('
    - '.PostArgs().Peek('
    - '.QueryString('
    - '.DefaultQuery('
    - '.GetHeader('
    - '.ClientIP()'
    - '.GetQuery('
    - '.ShouldBindJSON('
    - '.BindJSON('
    - '.Param('
    - '.QueryParam('
    - 'mux.Vars('
    - 'chi.URLParam('
    - 'os.Getenv('
    - 'os.Environ()'
    - 'os.Args'
    - 'os.Stdin'
    - 'os.ReadFile('
    - 'ioutil.ReadFile('
    - '.Body'
    info_disclosure:
    - 'runtime.Stack('
    - 'debug.Stack('

  sinks:
    sql_injection:
    - '.Query('
    - '.QueryContext('
    - '.QueryRow('
    - '.QueryRowContext('
    - '.Queryx('
    - '.QueryxContext('
    - '.Exec('
    - '.ExecContext('
    - '.MustExec('
    - '.NamedExec('
    - '.NamedQuery('
    - '.Prepare('
    - '.PrepareContext('
    - '.Raw('
    - '.Where('
    - '.Joins('
    - 'pg.Q('
    xss:
    - 'template.HTML('
    - 'template.URL('
    - 'template.JS('
    - 'template.JSStr('
    - 'template.HTMLAttr('
    - 'w.Write('
    - 'fmt.Fprintf('
    - 'io.WriteString('
    command_injection:
    - 'exec.Command('
    - 'exec.CommandContext('
    - 'syscall.Exec('
    - 'syscall.ForkExec('
    - 'syscall.StartProcess('
    - 'os.StartProcess('
    - 'sh.Command('
    - '.CombinedOutput('
    ssrf:
    - 'http.Get('
    - 'http.Post('
    - 'http.PostForm('
    - 'http.Head('
    - 'http.NewRequest('
    - 'http.NewRequestWithContext('
    - '.Do('
    - '.RoundTrip('
    - 'net.Dial('
    - 'net.DialTimeout('
    - 'net.DialTCP('
    - 'net.DialUDP('
    - 'net.DialUnix('
    path_traversal:
    - 'os.Open('
    - 'os.OpenFile('
    - 'os.Create('
    - 'os.CreateTemp('
    - 'os.MkdirAll('
    - 'os.Remove('
    - 'os.RemoveAll('
    - 'os.ReadFile('
    - 'os.WriteFile('
    - 'os.Symlink('
    - 'ioutil.ReadFile('
    - 'ioutil.WriteFile('
    - 'ioutil.ReadDir('
    - 'ioutil.TempFile('
    - 'ioutil.TempDir('
    - 'filepath.Join('
    - 'filepath.Glob('
    - 'http.ServeFile('
    - 'http.Dir('
    xxe:
    - 'xml.Unmarshal('
    - 'xml.NewDecoder('
    - 'xml.NewTokenDecoder('
    - '.DecodeElement('
    - '.RawToken('
    - '.ParseString('
    - '.ParseReader('
    deserialization:
    - 'gob.NewDecoder('
    - '.DecodeValue('
    - 'yaml.Unmarshal('
    - 'yaml.UnmarshalStrict('
    - 'yaml.NewDecoder('
    - 'json.Unmarshal('
    - 'json.NewDecoder('
    open_redirect:
    - 'http.Redirect('
    - 'http.RedirectHandler('
    - 'w.Header().Set("Location'
    log_injection:
    - 'log.Printf('
    - 'log.Println('
    - 'log.Print('
    - 'log.Fatalf('
    - 'log.Fatalln('
    - 'log.Fatal('
    - 'log.Panicf('
    - 'log.Output('
    - 'fmt.Printf('
    - 'fmt.Println('
    - 'fmt.Print('
    - 'fmt.Fprintf('
    - 'slog.Info('
    - 'slog.Error('
    - 'logrus.Infof('
    - 'logrus.Errorf('
    - 'logrus.WithField('
    crypto_weakness:
    - 'md5.Sum('
    - 'md5.New('
    - 'sha1.Sum('
    - 'sha1.New('
    - 'des.NewCipher('
    - 'des.NewTripleDESCipher('
    - 'rc4.NewCipher('
    - 'md4.New('
    - 'ripemd160.New('
    - 'cipher.NewCBCEncrypter('
    - 'InsecureSkipVerify'
    - 'InsecureCipherSuites('
    - 'VersionSSL30'
    - 'VersionTLS10'
    - 'VersionTLS11'
    info_disclosure:
    - 'http.Error('
    - 'w.Write('
    - 'fmt.Fprintf('
    auth_bypass:
    - 'AuthCodeURL('
    - 'http.SetCookie('
    - 'SetCookie('
    - 'HttpOnly'
    xpath_injection:
    - '.EvalXPath('
    - '.FindOne('
    - '.QueryAll('
    - '.SelectElement('
    - '.SearchWithVariables('
    - '.ParseExec('
    - 'xpath.Compile('
    - 'xpath.MustCompile('
    - 'xmlpath.Compile('
    - 'xmlpath.MustCompile('
    code_injection:
    - '.RunString('
    - '.DoString('
    - '.NewEvaluableExpression('
    - '.RunProgram('

  sanitizers:
    sql_injection:
    - 'database/sql'
    - '.QuoteLiteral('
    - '.QuoteIdentifier('
    xss:
    - 'html/template'
    - 'html.EscapeString('
    - 'template.HTMLEscapeString('
    - 'template.JSEscapeString('
    - 'json.Marshal('
    - 'url.QueryEscape('
    - 'url.PathEscape('
    - 'strconv.Quote('
    - 'regexp.QuoteMeta('
    log_injection:
    - 'strings.ReplaceAll('
    crypto_weakness:
    - 'bcrypt.GenerateFromPassword('
    - 'bcrypt.CompareHashAndPassword('
    - 'sha256.Sum256('
    - 'sha512.Sum512('
    - 'subtle.ConstantTimeCompare('
    - 'hmac.Equal('
