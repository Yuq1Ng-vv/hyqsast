# php.yaml — 精选适配的额外规则（备用：引擎暂未支持 php，规则先行备好）
# 来源：历史 CodeQL PHP 查询 + RIPS/PHPStan-security sink 覆盖（手工精选）
# 匹配：sources/sinks/sanitizers 为子串；sink 决定 vuln_type；sanitizer 按 sink 类别生效
# 说明：sanitizer 已从「全塞 sql_injection」按类别重新分发（xss/command/crypto 等）

php:
  sources:
    injection_general:
    - '$_GET'
    - '$_POST'
    - '$_REQUEST'
    - '$_COOKIE'
    - '$_FILES'
    - '$_SERVER'
    - '$_SESSION'
    - '$_ENV'
    - 'php://input'
    - 'getenv('
    - 'getParameter('
    - '->input('
    - '->getQuery('
    - 'request->get('
    - '->getQueryParams('
    - 'apache_request_headers('
    - 'getallheaders('
    - '->headers->get('
    - '->header('
    - '->cookie('
    - '->getContent('
    - '->json('

  sinks:
    sql_injection:
    - 'mysqli_query('
    - 'mysqli->query('
    - 'mysqli_multi_query('
    - 'mysql_query('
    - 'mssql_query('
    - 'oci_parse('
    - 'oci_execute('
    - 'pg_query('
    - 'pg_execute('
    - 'pg_query_params('
    - 'PDO::query('
    - 'PDO->query('
    - '->query('
    - 'PDO::exec('
    - '->exec('
    - 'sqlite_query('
    - 'SQLite3::query('
    - '->Execute('
    xss:
    - 'print('
    - 'printf('
    - 'print_r('
    - 'var_dump('
    - 'vprintf('
    - 'fprintf('
    - 'vfprintf('
    - 'echo $'
    - 'print $'
    - '<?='
    command_injection:
    - 'exec('
    - 'system('
    - 'shell_exec('
    - 'passthru('
    - 'proc_open('
    - 'popen('
    - 'pcntl_exec('
    code_injection:
    - 'eval('
    - 'assert('
    - 'create_function('
    - 'preg_replace('
    - 'mb_ereg_replace('
    - 'call_user_func('
    - 'call_user_func_array('
    - 'array_map('
    - 'usort('
    - 'uasort('
    deserialization:
    - 'unserialize('
    - '->unserialize('
    ssti:
    - 'twig->render('
    - 'Blade::render('
    - 'Smarty->fetch('
    - 'Smarty->display('
    - '->render('
    - '->fetch('
    - '->display('
    ssrf:
    - 'file_get_contents('
    - 'curl_init('
    - 'curl_exec('
    - 'fsockopen('
    - 'fopen('
    - 'stream_socket_client('
    - 'get_headers('
    - 'file('
    - 'readfile('
    path_traversal:
    - 'file_get_contents('
    - 'file_put_contents('
    - 'fopen('
    - 'readfile('
    - 'include('
    - 'require('
    - 'include_once('
    - 'require_once('
    - 'unlink('
    - 'rmdir('
    - 'rename('
    - 'copy('
    - 'filesize('
    - 'file_exists('
    xxe:
    - 'simplexml_load_file('
    - 'simplexml_load_string('
    - 'DOMDocument->load('
    - 'DOMDocument->loadXML('
    - 'xml_parse('
    - 'XMLReader->read('
    - '->loadXML('
    - '->load('
    - 'SimpleXML->load('
    open_redirect:
    - 'Location:'
    - 'location:'
    - 'wp_redirect('
    - '->redirect('
    header_injection:
    - 'header('
    - '->withHeader('
    - 'setHeader('
    log_injection:
    - 'error_log('
    - 'syslog('
    - '->log('
    format_string:
    - 'sprintf('
    - 'vsprintf('
    - 'printf('
    - 'fprintf('
    - 'vfprintf('
    crypto_weakness:
    - 'md5('
    - 'sha1('
    - 'crypt('
    - 'base64_encode('
    - 'mcrypt_encrypt('
    - 'mcrypt_decrypt('
    - 'openssl_encrypt('
    - 'openssl_decrypt('
    - 'sha1_file('
    - 'md5_file('
    info_disclosure:
    - 'phpinfo('
    - 'var_dump('
    - 'print_r('
    - 'var_export('
    - 'highlight_file('
    - 'show_source('
    - 'get_defined_vars('
    - '->dump('
    - '->dd('

  sanitizers:
    sql_injection:
    - 'addslashes('
    - 'mysqli_real_escape_string('
    - 'mysql_real_escape_string('
    - 'pg_escape_string('
    - '->escapeString('
    - '->prepare('
    - 'PDO::prepare('
    - 'mysqli_prepare('
    - '->quote('
    - '->bind_param('
    - '->bindParam('
    - '->bindValue('
    - 'filter_var('
    - 'filter_input('
    - 'preg_quote('
    - 'intval('
    - '(int)'
    - 'ctype_digit('
    - 'is_numeric('
    - 'oci_bind_by_name('
    xss:
    - 'htmlspecialchars('
    - 'htmlentities('
    - 'strip_tags('
    - 'urlencode('
    - 'rawurlencode('
    command_injection:
    - 'escapeshellarg('
    - 'escapeshellcmd('
    crypto_weakness:
    - 'hash_equals('
    - 'password_hash('
    - 'password_verify('
