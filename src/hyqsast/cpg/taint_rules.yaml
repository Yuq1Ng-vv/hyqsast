  # pattern_sinks: 标记「非污点流 pattern 型」sink 类别 —— sink 节点没有
  # source 流入、BFS 够不到，但类别本身代表危险 API 使用，analyzer 对每个
  # 被标上该类别的节点无条件产出 finding。
  #
  # 用「精确弱 API 专用类别」而不用 crypto_weakness：内置 crypto_weakness
  # sinks 含大量宽模式（getInstance(、Random( …），一旦标记为 pattern 型，
  # 任何 getInstance/SecureRandom() 都会被无条件命中 → 强算法/强随机数
  # 全报（FP 爆炸，且会被 rules/ 的 CodeQL 适配层再放大）。所以：
  #   - insecure_hash    只列硬编码弱算法精确子串（MessageDigest 的
  #                       "MD5"/"SHA-1" 大小写变体 + DigestUtils 弱 API）
  #   - weak_randomness  只用 java.util.Random / Math.random（避开
  #                       SecureRandom() 子串碰撞）
  #   - secure_cookie    setSecure(false) 即漏洞候选
  #   - weak_crypto      硬编码弱算法精确子串（DES/RC4/RC2/Blowfish/AES-ECB 等，
  #                       避开 DESede/强算法子串碰撞；与 crypto_weakness 的 taint
  #                       型共存，见下「weak_crypto 与 crypto_weakness」注记）
  # crypto_weakness 保持污点流（BFS-only），由 source 流入时照常产出。
  #
  # weak_crypto 与 crypto_weakness：crypto_weakness 是 taint 型（有 source 流入
  # 才报，sinks 含 getInstance( 等宽模式），弱加密 API 若同时被 source 流入仍走
  # 它；weak_crypto 只接「没有任何 source 流入的硬编码弱算法」这类 BFS 够不到
  # 的。两者在同一节点上都命中时，analyzer 按位置去重（weak_crypto 让位给已有
  # 的 crypto_weakness taint finding，见 analyzer._pattern_findings），避免重复。
  # 评分侧：weak_crypto finding 带 related_categories=["crypto_weakness"]，
  # 使 score.py 的类别命中判断把两者都算 crypto。
  pattern_sinks:
  - insecure_hash
  - weak_randomness
  - secure_cookie
  - weak_crypto

