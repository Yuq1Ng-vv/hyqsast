  # sink_excludes：正则在候选 sink 文本上 re.search，命中则丢弃 sink 标签。
  # P1-6（2026-08-26）：auth_bypass 的 jwt.decode 只保留「显式 verify=False」——
  # 签名校验跳过才是绕过；显式 verify=True 与省略 verify（PyJWT 默认 True）
  # 都是安全校验，排除。负向环视：decode 调用后 300 字符内无 verify=False 即排除。
  # 效果：vampi 6 条正常 decode 误报消除，vfa 的 verify=False 真绕过保留。
  sink_excludes:
  - 'jwt\.decode\((?![\s\S]{0,300}?verify\s*=\s*False)'
