[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hyqsast"
version = "0.1.0"
description = "独立确定性污点分析模块 — 输入源码目录，输出接口/漏洞类型/调用链"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "HyqSast" }]
keywords = ["security", "sast", "taint-analysis", "cpg", "code-audit"]

# 只保留 CPG 确定性分析所需的轻量依赖 —— 不含 LLM / langgraph / 报告栈
dependencies = [
    "tree-sitter>=0.25,<0.27",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "networkx>=3.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.14",
]

[project.scripts]
hyqsast = "hyqsast.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hyqsast"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".git", "__pycache__", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "N", "UP"]
